[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Placeholder distribution name until the project is named (CLAUDE.md, open decisions).
name = "fleet-sdk"
version = "0.0.1"
description = "Python SDK for fleet-server: robots and services dial out, enroll once, stay connected."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
