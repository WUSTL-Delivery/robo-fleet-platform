[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Placeholder distribution name until the project is named (CLAUDE.md, open decisions).
name = "fleet-sdk"
version = "0.0.1"
description = "Python SDK for fleet-server: robots and services dial out, enroll once, stay connected."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "websockets>=13",
  # fleet/protocol.py needs NotRequired, which typing gained in 3.11.
  "typing_extensions>=4.7; python_version < '3.11'",
]

[project.optional-dependencies]
# Twist over a WebRTC data channel (fleet/webrtc.py; protocol/README.md, "Teleop data
# plane"). Optional: without it the robot is driven over the bus and nothing else changes.
webrtc = [
  "aiortc>=1.9",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  # Contract tests: validate protocol/fixtures against the schemas (draft 2020-12).
  "jsonschema>=4.18",
]

[tool.hatch.build.targets.wheel]
packages = ["fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
