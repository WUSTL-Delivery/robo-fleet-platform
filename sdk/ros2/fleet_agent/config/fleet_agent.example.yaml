# Parameters for the fleet_agent node. Copy this file, edit it, and run:
#   ros2 run fleet_agent fleet_agent --ros-args --params-file <your copy>
#
# Numbers declared as decimals must stay decimals (1.0, not 1): ROS 2 rejects an
# integer for a double parameter.
fleet_agent:
  ros__parameters:
    # fleet-server's WebSocket endpoint. A deployed server is wss://<host>/ws.
    url: ws://localhost:8080/ws

    # Display name in the console. Default: this machine's hostname.
    name: delivery-01

    # Where the robot's token is kept (JSON, mode 0600). Written on the first run;
    # every later run reuses it, so the robot keeps its id. Delete it to enroll as
    # a new robot. Default: ~/.fleet/<name>.json
    token_file: ~/.fleet/delivery-01.json

    # The fleet's enrollment key, read only while token_file is empty. Prefer the
    # FLEET_ENROLL_KEY environment variable so the key never sits in a file.
    # enroll_key: ""

    # Manifest: the drive contract. Leave drive.type empty for a robot that cannot
    # be driven; with "twist" both limits are required and must be > 0.
    drive.type: twist
    drive.max_v_mps: 1.5
    drive.max_w_radps: 1.5

    # Teleop output (only with drive.type set). The twist of the operator who holds
    # the lease is clamped to the two limits above and published here as
    # geometry_msgs/Twist. Point it at the highest-priority input of the robot's
    # twist mux. Default: cmd_vel (relative, so it follows the node's namespace).
    cmd_vel.topic: /cmd_vel_teleop
    # Deadman: zero velocity is on cmd_vel.topic within this many milliseconds of the
    # last valid twist, with or without a network. An integer (300, not 300.0),
    # 100 to 1000. The console sends twist every 100 ms; leave this at 300.
    cmd_vel.deadman_ms: 300
    # The base controller or the mux still needs its own command timeout: if this
    # process is killed, nothing here can publish a stop.
    #
    # Lease state is latched on fleet/lease (fleet_agent_msgs/Lease); no parameter.

    # Twist over a direct WebRTC data channel, next to the bus. "auto": used when
    # aiortc is installed (pip install './sdk/python[webrtc]') and the operator's
    # console offers it; otherwise, and with "off", twist arrives over the bus only.
    # Either way it goes through the same lease check and the same deadman.
    data_channel: auto

    # Channels: the application node's way to talk to the rest of the fleet (a
    # dispatcher, another robot) without a websocket. Each name gets two topics of
    # type fleet_agent_msgs/ChannelMsg, with the data as JSON text:
    #   /fleet/ch/<name>/in    what arrived for this robot
    #   /fleet/ch/<name>/out   what the application sends (`to` empty = broadcast)
    # The names are also declared in the manifest, which is what makes broadcasts
    # on them reach this robot. A name must start with a lowercase letter and hold
    # only lowercase letters, digits and single underscores (it is part of a topic
    # name). Default: none.
    channels: [assignment, delivery_status]
    # Acked sends. A sender that wants a receipt publishes {"seq": n, "data": ...}
    # and re-sends until it hears {"ack": n}. By default fleet_agent answers for
    # the application: the in topic carries the inner data once per send, with
    # `acked: true`, and the ack is sent when at least one node subscribes to the
    # in topic (never when nothing listens). List a channel here to get the
    # {"seq", "data"} message as it is, repeats included, and publish the
    # {"ack": n} reply from the application instead. Default: none.
    # raw_channels: [assignment]
    #
    # The service /fleet/request_help (fleet_agent_msgs/RequestHelp) raises the
    # robot's hand for an operator; no parameter.

    # Telemetry sources. Leave a topic empty if the robot does not have it.
    # fix_topic (sensor_msgs/NavSatFix) becomes a geographic pose; a robot without
    # GPS leaves it empty and is online without a pose.
    telemetry.fix_topic: /gps/fix
    # battery_topic (sensor_msgs/BatteryState) also declares a battery in the manifest.
    telemetry.battery_topic: /battery_state
    # Samples per second sent to the server.
    telemetry.rate_hz: 1.0
    # Stop reporting a pose this long after the last fix (0.0 = keep the last one forever).
    telemetry.pose_timeout_s: 5.0
