name: CI

# Test on every push and PR; publish the server image to GHCR from the default
# branch (":edge") and from version tags ("vX.Y.Z" → ":X.Y.Z", ":X.Y", ":X").
# Consumers (the club repo) pin an exact tag in compose. See docs/RELEASING.md.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# One run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            sdk/go/go.sum

      - name: gofmt
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: go test
        working-directory: server
        run: go test ./...

      # Same gate the club deploy uses: refuse to ship a known vulnerability.
      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # sdk/go is its own Go module (the wire types in sdk/go/protocol, imported by the
  # server through a replace), so `./...` in server/ does not reach it. The schema
  # contract test (sdk/go/protocol) and the client tests (sdk/go/fleet) run here.
  sdk-go:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4

      # Runs on the server's toolchain; sdk/go/go.mod declares the oldest Go the
      # SDK supports, which is not what CI should build with. The client tests
      # build and run a real fleet-server, so the cache covers its modules too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            sdk/go/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # One client test sends acked jobs to sdk/python/examples/fake_robot.py. It
      # skips unless FLEET_TEST_PYTHON can import the Python SDK's dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install the Python SDK for the interop test
        run: python -m pip install ../python

      - name: go test
        run: go test -race ./...
        env:
          FLEET_TEST_PYTHON: python

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      # Node 20 is the oldest runtime the SDK supports (package.json engines).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - run: npm ci

      # Fails when src/generated no longer matches protocol/schemas + catalog.json:
      # a schema change must be committed together with `npm run gen` output.
      - name: generated types up to date
        run: npm run gen:check

      - run: npm run typecheck

      # The client tests' globalSetup builds and runs a real fleet-server.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: npm test

      - run: npm run build

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      # 3.10 is the oldest runtime the SDK supports (pyproject requires-python).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      # Fails when fleet/protocol.py no longer matches protocol/schemas + catalog.json:
      # a schema change must be committed together with `python scripts/gen.py` output.
      # The generator is stdlib-only, so this runs before installing anything.
      - name: generated types up to date
        run: python scripts/gen.py --check

      - run: python -m pip install -e '.[dev]'

      # The client tests' fleet_server fixture builds and runs a real fleet-server.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: python -m pytest

  sim:
    name: Sim fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sim/package-lock.json
            console/package-lock.json

      # The sim depends on the SDK via "file:../sdk/typescript" (built dist/).
      - name: build SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build

      # The integration tests' globalSetup builds and runs a real fleet-server.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The data-plane test drives the console's own twist transport module
      # (console/src/teleop/twistTransport.ts), so its dependencies must resolve.
      - name: install console dependencies
        working-directory: console
        run: npm ci

      - name: typecheck and test
        working-directory: sim
        run: npm ci && npm run typecheck && npm test

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            console/package-lock.json

      # The console depends on the SDK via "file:../sdk/typescript" (built dist/).
      - name: build SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build

      - name: test and build console
        working-directory: console
        run: npm ci && npm test && npm run build

  image:
    name: Build and publish image
    needs: [test, sdk-go, console]
    # Default branch and version tags only; never for pull requests (a fork's
    # PR has no packages:write token anyway).
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stamped into the binary as main.version: "0.1.0" for tag v0.1.0,
      # otherwise the branch name (e.g. "main") — `fleet-server -version` prints it.
      - name: Compute version
        id: version
        run: |
          ref="${{ github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # metadata-action lowercases the owner (GHCR requires lowercase names), so
      # "WUSTL-Delivery" becomes "wustl-delivery" in the published image name.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleet-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # Repo root: the image also builds console/ and sdk/typescript/.
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sdk-ros2:
    name: ROS 2 fleet_agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the ROS 2 dev image (sdk/ros2/Dockerfile), then inside it builds
      # fleet-server and the colcon workspace and runs the tests; the launch tests
      # run the node against a real fleet-server. Humble is the robot's distro.
      - name: build and test in the ROS 2 container
        run: sdk/ros2/test.sh
        env:
          ROS_DISTRO: humble
