# fleet-server bootstrap config — describes the installation, nothing else.
# Fleets, robots, tokens, operators live in the database (managed at runtime);
# capabilities arrive over the wire as manifests.

listen: ":8080"
db: "fleet.db"

# Presence: clients heartbeat at this interval; ~2.5 missed beats => offline.
heartbeat_interval_ms: 10000

# Teleop authority: leases expire this long after grant/renew.
lease_ttl_ms: 15000

# How often the server sweeps for lapsed heartbeats and expired leases.
sweep_ms: 1000

# Control-plane rate limits, per connection, metered separately for telemetry and
# channel.publish. Over-limit messages are dropped and the client gets a
# rate_limited error (at most one per second); the socket stays open. Heartbeats,
# leases and everything else are never throttled.
client_msgs_per_sec: 50
client_msgs_burst: 100

# Admin API (fleetctl): POST /api/admin/... authenticated by this bearer token.
# Leave unset to keep the admin API off. Prefer FLEET_ADMIN_TOKEN over putting
# the secret in this file. At least 16 characters.
# admin_token: ""

# Console map home view: where the map opens, and how much around it to show.
# Unset, the console fits the view to wherever the fleet is. With map_lock the
# operator can't pan or zoom out beyond the area (with a 1.5x margin); "Home"
# returns to it. Env: FLEET_MAP_CENTER, FLEET_MAP_RADIUS_M, FLEET_MAP_LOCK.
# map_center: "38.6488,-90.3108"   # lat,lon
# map_radius_m: 1000               # default 1000 when map_center is set
# map_lock: false
